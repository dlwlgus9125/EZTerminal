name: Release

# Both entry points build from the exact checked-out SHA. A v* tag creates a
# draft release; workflow_dispatch only produces reviewable RC artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  rust-quality:
    name: Release native remote host quality
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Native quality and supply-chain gate
        working-directory: native/remote-host
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed.' }
          cargo test --locked --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed.' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'cargo clippy failed.' }
          cargo install cargo-audit --version 0.22.2 --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo-audit installation failed.' }
          cargo install cargo-deny --version 0.20.2 --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo-deny installation failed.' }
          cargo audit --deny warnings
          if ($LASTEXITCODE -ne 0) { throw 'cargo audit failed.' }
          cargo deny check
          if ($LASTEXITCODE -ne 0) { throw 'cargo deny failed.' }

  android-instrumentation:
    name: Release Android instrumentation (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_BUILD_SHA: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # Keep release instrumentation on a responsive, hardware-accelerated AVD.
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # The mobile filter can still expose root lifecycle scripts; this lane
      # needs JS assets only and must not compile the desktop `cap` addon.
      - name: Install mobile dependencies
        run: pnpm install --filter ezterminal-mobile... --frozen-lockfile --ignore-scripts
      - name: Build and sync production mobile assets
        shell: bash
        run: |
          pnpm --dir mobile build:release
          pnpm --dir mobile cap:sync
          status="$(git status --porcelain --untracked-files=all -- mobile/android)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - name: Run device-side release contracts
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd mobile/android && ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

  release:
    needs: [android-instrumentation, rust-quality]
    runs-on: windows-2022
    timeout-minutes: 360
    environment: release
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.publish_metadata.outputs.artifact_name }}
      release_version: ${{ steps.publish_metadata.outputs.release_version }}
      validation_profile: ${{ steps.publish_metadata.outputs.validation_profile }}
      release_notes_path: ${{ steps.publish_metadata.outputs.release_notes_path }}
      release_sums_sha256: ${{ steps.publish_metadata.outputs.release_sums_sha256 }}
    env:
      EZTERMINAL_PLAYWRIGHT_RETRIES: "0"
      EZTERMINAL_BUILD_SHA: ${{ github.sha }}
      VITE_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - run: pnpm install --frozen-lockfile

      - name: Export and verify release identity
        shell: pwsh
        env:
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
          LOCAL_RC_APPROVED_SHA: ${{ vars.EZTERMINAL_LOCAL_RC_APPROVED_SHA }}
          LOCAL_RC_REPORT_SHA256: ${{ vars.EZTERMINAL_LOCAL_RC_REPORT_SHA256 }}
          LOCAL_RC_EVIDENCE_SHA256: ${{ vars.EZTERMINAL_LOCAL_RC_EVIDENCE_SHA256 }}
          LOCAL_RC_EVIDENCE_BASE64: ${{ secrets.EZTERMINAL_LOCAL_RC_EVIDENCE_BASE64 }}
        run: |
          $protectedEvidenceBase64 = $env:LOCAL_RC_EVIDENCE_BASE64
          $env:LOCAL_RC_EVIDENCE_BASE64 = $null
          pnpm verify:version
          if ($LASTEXITCODE -ne 0) { throw 'Version contract verification failed.' }
          $contract = Get-Content release/version.json -Raw | ConvertFrom-Json
          $rootVersion = [string]$contract.version
          $androidCode = [int]$contract.androidVersionCode
          $validationProfile = [string]$contract.validationProfile
          if ($validationProfile -notin @('full', 'functional-hotfix')) {
            throw "Unsupported release validation profile: $validationProfile"
          }
          $repositoryCert = ((Get-Content mobile/android/signing-certificate.sha256 -Raw) -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($repositoryCert -notmatch '^[0-9A-F]{64}$') {
            throw 'The committed Android release certificate fingerprint is UNCONFIGURED or invalid. Generate the long-term key and commit its public SHA-256 fingerprint before release.'
          }
          if ($env:WORKFLOW_EVENT_NAME -eq 'push' -and "v$rootVersion" -cne $env:WORKFLOW_REF_NAME) {
            throw "Tag $env:WORKFLOW_REF_NAME does not match v$rootVersion."
          }
          $head = (git rev-parse HEAD).Trim()
          if (
            $LASTEXITCODE -ne 0 -or
            $head -notmatch '^[0-9a-f]{40}$' -or
            $head -cne $env:WORKFLOW_SHA
          ) {
            throw "Checkout SHA $head differs from workflow SHA $env:WORKFLOW_SHA."
          }
          if ($validationProfile -eq 'full') {
          if ($env:LOCAL_RC_APPROVED_SHA -ne $head) {
            throw 'Protected release Environment does not approve this exact SHA. Run the local RC gate and update EZTERMINAL_LOCAL_RC_APPROVED_SHA.'
          }
          $rcReportHash = ($env:LOCAL_RC_REPORT_SHA256 -replace '[^0-9A-Fa-f]', '').ToLowerInvariant()
          if ($rcReportHash -notmatch '^[0-9a-f]{64}$') {
            throw 'EZTERMINAL_LOCAL_RC_REPORT_SHA256 must be a 64-digit SHA-256 from the approved local RC report.'
          }
          $evidenceBundleHash = (
            $env:LOCAL_RC_EVIDENCE_SHA256 -replace '[^0-9A-Fa-f]', ''
          ).ToLowerInvariant()
          if ($evidenceBundleHash -notmatch '^[0-9a-f]{64}$') {
            throw 'EZTERMINAL_LOCAL_RC_EVIDENCE_SHA256 must be a 64-digit bundle SHA-256.'
          }
          if ([string]::IsNullOrWhiteSpace($protectedEvidenceBase64)) {
            throw 'Protected release Environment must provide EZTERMINAL_LOCAL_RC_EVIDENCE_BASE64.'
          }
          try {
            $evidenceBundleBytes = [Convert]::FromBase64String(
              $protectedEvidenceBase64
            )
          } catch {
            throw 'EZTERMINAL_LOCAL_RC_EVIDENCE_BASE64 is not valid base64.'
          } finally {
            $protectedEvidenceBase64 = $null
          }
          $evidenceBundlePath = Join-Path $env:RUNNER_TEMP 'local-rc-evidence.zip'
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP "local-rc-evidence-$head"
          if (
            (Test-Path -LiteralPath $evidenceBundlePath) -or
            (Test-Path -LiteralPath $evidenceDirectory)
          ) {
            throw 'The protected evidence target already exists on the release runner.'
          }
          [IO.File]::WriteAllBytes($evidenceBundlePath, $evidenceBundleBytes)
          $evidenceBundleBytes = $null
          $actualEvidenceBundleHash = (
            Get-FileHash -LiteralPath $evidenceBundlePath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualEvidenceBundleHash -ne $evidenceBundleHash) {
            throw (
              "Local RC evidence bundle hash mismatch: expected " +
              "$evidenceBundleHash, got $actualEvidenceBundleHash."
            )
          }
          $extractJson = ./scripts/release-evidence-bundle.ps1 `
            -Extract `
            -BundlePath $evidenceBundlePath `
            -DestinationDirectory $evidenceDirectory `
            -ExpectedEntryNames @(
              'local-rc-report.json',
              'mobile-soak-report.json',
              'desktop-performance-baseline.json',
              'desktop-performance-report.json'
            ) | Out-String
          $extracted = $extractJson | ConvertFrom-Json
          if (
            [string]$extracted.operation -ne 'extract' -or
            [string]$extracted.bundleSha256 -ne $evidenceBundleHash -or
            @($extracted.files).Count -ne 4
          ) {
            throw 'Protected local RC evidence extraction did not preserve the approved bundle.'
          }
          $rcReportPath = Join-Path $evidenceDirectory 'local-rc-report.json'
          $mobileSoakReportPath = Join-Path $evidenceDirectory 'mobile-soak-report.json'
          $performanceBaselineReportPath = Join-Path (
            $evidenceDirectory
          ) 'desktop-performance-baseline.json'
          $performanceCandidateReportPath = Join-Path (
            $evidenceDirectory
          ) 'desktop-performance-report.json'
          $actualRcReportHash = (Get-FileHash -LiteralPath $rcReportPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualRcReportHash -ne $rcReportHash) {
            throw "Local RC report hash mismatch: expected $rcReportHash, got $actualRcReportHash."
          }
          try {
            $rcReport = Get-Content -LiteralPath $rcReportPath -Raw | ConvertFrom-Json
          } catch {
            throw 'Protected local RC report is not valid JSON.'
          }
          if (
            [int]$rcReport.schemaVersion -ne 2 -or
            [string]$rcReport.releaseStage -ne 'release' -or
            [string]$rcReport.evidenceCompleteness -ne 'complete' -or
            [string]$rcReport.appVersion -ne $rootVersion
          ) {
            throw 'Local RC report schema/stage/completeness/app version does not match this release.'
          }
          $sourceEvidenceJson = & node scripts/verify-release-source-evidence.mjs `
            --report $rcReportPath `
            --mobile-soak $mobileSoakReportPath `
            --performance-baseline $performanceBaselineReportPath `
            --performance-candidate $performanceCandidateReportPath `
            --expected-version $rootVersion `
            --expected-build-sha $head `
            --expected-stage release | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Host $sourceEvidenceJson
            throw 'Protected local RC source evidence validation failed.'
          }
          $sourceEvidence = $sourceEvidenceJson | ConvertFrom-Json
          if ($sourceEvidence.ok -ne $true) {
            throw 'Protected local RC source-evidence validator did not report success.'
          }
          if (
            [string]$rcReport.buildSha -ne $head -or
            [int]$rcReport.playwrightRetries -ne 0 -or
            [int]$rcReport.mobileConnectionAttemptsPerScenario -ne 1 -or
            [int]$rcReport.mobileSocketAttemptsBeforeInitialAuth -ne 1 -or
            [string]$rcReport.mobileTransport -ne 'adb-reverse-loopback' -or
            [int]$rcReport.mobileRemotePort -ne 17420 -or
            [string]$rcReport.emulatorBootMode -ne 'cold-no-snapshot'
          ) {
            throw 'Local RC report is not bound to this exact zero-retry, cold-boot, single-connect release commit.'
          }
          $devices = @($rcReport.devices)
          $api29 = @($devices | Where-Object { $_.status -eq 'passed' -and $_.avd -and [int]$_.api -eq 29 })
          $api35 = @($devices | Where-Object { $_.status -eq 'passed' -and $_.avd -and [int]$_.api -eq 35 })
          if ($api29.Count -lt 1 -or $api35.Count -lt 1) {
            throw 'Local RC report lacks passing API 29 or API 35 emulator evidence.'
          }
          foreach ($device in @($api29 + $api35)) {
            $lanes = @($device.lanes | ForEach-Object { [string]$_ })
            foreach ($requiredLane in @(
              'instrumentation',
              'qr-scanner',
              'smoke',
              'stabilization',
              'parity',
              'theme-effects',
              'handoff-surfaces'
            )) {
              if ($lanes -notcontains $requiredLane) {
                throw "Local RC API $($device.api) evidence omits '$requiredLane'."
              }
            }
          }
          if ([string]$rcReport.validationPolicy -ne 'current-windows-host-and-api-29-35-emulators') {
            throw 'Local RC report does not use the approved current-host/emulator validation policy.'
          }
          $requiredFunctionalLimits = @(
            'Lock and UAC secure-desktop capture and input are not supported.',
            'Software SAS and Ctrl+Alt+Delete are not supported.',
            'GDI capture, OpenH264 encoding and SendInput injection remain in the normal-user transport.'
          )
          foreach ($limit in $requiredFunctionalLimits) {
            if (@($rcReport.knownFunctionalLimits) -notcontains $limit) {
              throw "Local RC report omits the required functional limit: $limit"
            }
          }
          $performance = $rcReport.desktopPerformance
          $performanceResults = @($performance.results)
          $performanceFailures = @($performanceResults | Where-Object {
            [double]$_.deltaPercent -gt 5 -or
            ($_.targeted -eq $true -and [double]$_.deltaPercent -gt -15)
          })
          $candidateMetrics = $performance.candidate.metrics
          $requiredPerformanceMetrics = @(
            'cancellationLatencyMs',
            'rows100kCompletionMs',
            'plainOutput1_1MiBCompletionMs',
            'plainOutput12MiBRetentionPressureMs'
          )
          $invalidPerformanceSamples = @($requiredPerformanceMetrics | Where-Object {
            $metric = $candidateMetrics.$_
            $null -eq $metric -or
            [int]$metric.warmupRuns -ne 5 -or
            @($metric.samples).Count -ne 25
          })
          $candidateProvenance = $performance.candidate.provenance
          $productProvenance = $candidateProvenance.product
          $harnessProvenance = $candidateProvenance.harness
          $launchArtifactPaths = @($productProvenance.launchArtifacts.files | ForEach-Object {
            [string]$_.path
          })
          $requiredLaunchArtifacts = @(
            'build/interpreter-process.js',
            'build/main.js',
            'build/packet-capture-host.js',
            'build/preload.js',
            'build/script-host.js',
            'renderer/main_window/index.html'
          )
          $missingLaunchArtifacts = @($requiredLaunchArtifacts | Where-Object {
            $launchArtifactPaths -notcontains $_
          })
          $invalidLaunchArtifacts = @($productProvenance.launchArtifacts.files | Where-Object {
            [string]$_.sha256 -notmatch '^[0-9a-f]{64}$' -or [int64]$_.bytes -lt 1
          })
          $reportedFixtures = @($harnessProvenance.fixtures)
          $largeFixture = @($reportedFixtures | Where-Object {
            [string]$_.id -eq 'largePlainOutput' -and
            [string]$_.path -eq 'e2e/fixtures/large-plain-output.js' -and
            [int64]$_.stdoutBytes -eq 1101119 -and
            [string]$_.stdoutSha256 -eq 'bbab0e75bbec8e2b80d281ab814a67d841e03167099d787a407d69a038ed717a' -and
            [string]$_.completionMarker -eq 'LARGE-OUTPUT-DONE'
          })
          $retentionFixture = @($reportedFixtures | Where-Object {
            [string]$_.id -eq 'retentionPressureOutput' -and
            [string]$_.path -eq 'e2e/fixtures/retention-pressure-output.js' -and
            [int64]$_.stdoutBytes -eq 12012025 -and
            [string]$_.stdoutSha256 -eq '8f4d6337d2637244a47991f82383f798e78b36a145b579c01c027b6a3bdeced7' -and
            [string]$_.completionMarker -eq 'RETENTION-PRESSURE-DONE'
          })
          $lockHash = (Get-FileHash pnpm-lock.yaml -Algorithm SHA256).Hash.ToLowerInvariant()
          $harnessHash = (
            Get-FileHash e2e/release-performance.spec.ts -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $largeFixtureHash = (
            Get-FileHash e2e/fixtures/large-plain-output.js -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $retentionFixtureHash = (
            Get-FileHash e2e/fixtures/retention-pressure-output.js -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          $installedElectronVersion = [string](
            Get-Content node_modules/electron/package.json -Raw | ConvertFrom-Json
          ).version
          $installedPlaywrightVersion = [string](
            Get-Content node_modules/@playwright/test/package.json -Raw | ConvertFrom-Json
          ).version
          $releaseNodeVersion = (& node -p 'process.versions.node').Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not resolve the release build Node version.'
          }
          $performanceResultNames = @($performanceResults | ForEach-Object { [string]$_.name })
          $missingPerformanceComparisons = @($requiredPerformanceMetrics | Where-Object {
            $performanceResultNames -notcontains $_
          })
          $targetPerformanceResult = @($performanceResults | Where-Object {
            [string]$_.name -eq 'plainOutput12MiBRetentionPressureMs' -and $_.targeted -eq $true
          })
          $cancellationSamples = @(
            $candidateMetrics.cancellationLatencyMs.samples |
              ForEach-Object { [double]$_ } |
              Sort-Object
          )
          $cancellationP95 = if ($cancellationSamples.Count -eq 25) {
            $cancellationSamples[[Math]::Ceiling($cancellationSamples.Count * 0.95) - 1]
          } else {
            [double]::PositiveInfinity
          }
          $cancellationMax = if ($cancellationSamples.Count -gt 0) {
            ($cancellationSamples | Measure-Object -Maximum).Maximum
          } else {
            [double]::PositiveInfinity
          }
          if (
            [string]$performance.status -ne 'passed' -or
            [double]$performance.maxP95RegressionPercent -ne 5 -or
            [double]$performance.minTargetP95ImprovementPercent -ne 15 -or
            @($performance.targetMetrics) -notcontains 'plainOutput12MiBRetentionPressureMs' -or
            [int]$performance.schemaVersion -ne 2 -or
            [string]$performance.baselineBuildSha -notmatch '^[0-9a-f]{40}$' -or
            [string]$performance.candidateBuildSha -ne $head -or
            [string]$performance.baselineReportSha256 -notmatch '^[0-9a-f]{64}$' -or
            [string]$performance.candidateReportSha256 -notmatch '^[0-9a-f]{64}$' -or
            [int]$performance.candidate.schemaVersion -ne 2 -or
            [string]$performance.candidate.evidenceMode -ne 'release' -or
            [string]$performance.candidate.buildSha -ne $head -or
            [int]$performance.candidate.warmupRuns -ne 5 -or
            [int]$performance.candidate.measurementRuns -ne 25 -or
            (@($performance.candidate.metricOrder) -join ',') -ne (
              $requiredPerformanceMetrics -join ','
            ) -or
            [string]$productProvenance.name -ne 'EZTerminal' -or
            [string]$productProvenance.version -ne $rootVersion -or
            [int]$productProvenance.protocolVersion -ne [int]$contract.protocolVersion -or
            [string]$productProvenance.buildSha -ne $head -or
            [string]$productProvenance.source.gitHeadSha -ne $head -or
            $productProvenance.source.workingTreeDirty -ne $false -or
            [string]$harnessProvenance.source.gitHeadSha -ne $head -or
            $harnessProvenance.source.workingTreeDirty -ne $false -or
            [string]$productProvenance.lock.sha256 -ne $lockHash -or
            [string]$harnessProvenance.lock.sha256 -ne $lockHash -or
            [string]$harnessProvenance.spec.sha256 -ne $harnessHash -or
            [string]$productProvenance.runtime.electron -ne $installedElectronVersion -or
            [string]::IsNullOrWhiteSpace([string]$productProvenance.runtime.node) -or
            [string]$harnessProvenance.runner.node -ne $releaseNodeVersion -or
            [string]$harnessProvenance.runner.playwright -ne $installedPlaywrightVersion -or
            [string]$productProvenance.launchArtifacts.entry -ne 'build/main.js' -or
            $missingLaunchArtifacts.Count -ne 0 -or
            $invalidLaunchArtifacts.Count -ne 0 -or
            $reportedFixtures.Count -ne 2 -or
            $largeFixture.Count -ne 1 -or
            $retentionFixture.Count -ne 1 -or
            [string]$largeFixture[0].sha256 -ne $largeFixtureHash -or
            [string]$retentionFixture[0].sha256 -ne $retentionFixtureHash -or
            [string]$performance.candidate.environment.platform -ne 'win32' -or
            [string]$performance.candidate.environment.arch -ne 'x64' -or
            [string]::IsNullOrWhiteSpace([string]$performance.candidate.environment.osRelease) -or
            [string]::IsNullOrWhiteSpace([string]$performance.candidate.environment.cpuModel) -or
            [int]$performance.candidate.environment.logicalCpuCount -lt 1 -or
            [int]$performance.candidate.environment.totalMemoryGiB -lt 1 -or
            [string]$performance.candidate.environment.hostFingerprint.algorithm -ne
              'windows-machine-guid-sha256-v1' -or
            [string]$performance.candidate.environment.hostFingerprint.sha256 -notmatch
              '^[0-9a-f]{64}$' -or
            [string]$performance.candidate.environment.powerPlan.schemeGuid -notmatch
              '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' -or
            [string]$performance.candidate.environment.powerPlan.powerSource -notmatch
              '^(ac|dc)$' -or
            [string]$performance.candidate.environment.powerPlan.effectivePowerMode -notmatch
              '^(battery-saver|better-battery|balanced|high-performance|max-performance)$' -or
            [string]$performance.candidate.environment.powerPlan.baseSettingsSha256 -notmatch
              '^[0-9a-f]{64}$' -or
            [string]$performance.candidate.environment.powerPlan.effectiveSettingsSha256 -notmatch
              '^[0-9a-f]{64}$' -or
            $invalidPerformanceSamples.Count -ne 0 -or
            $missingPerformanceComparisons.Count -ne 0 -or
            $targetPerformanceResult.Count -ne 1 -or
            [double]$cancellationP95 -gt 3000 -or
            [double]$cancellationMax -ge 5000 -or
            $performanceFailures.Count -ne 0
          ) {
            throw 'Local RC report lacks passing same-host desktop performance evidence.'
          }
          if (
            $rcReport.mobileSoak.status -ne 'passed' -or
            [string]$rcReport.mobileSoak.buildSha -ne $head -or
            [string]$rcReport.mobileSoak.appVersion -ne $rootVersion -or
            [int64]$rcReport.mobileSoak.durationMs -lt 1800000 -or
            [int]$rcReport.mobileSoak.sessionCount -ne 8 -or
            [int]$rcReport.mobileSoak.recoveryCycles -ne 20 -or
            $rcReport.mobileSoak.memoryPassed -ne $true -or
            $rcReport.mobileSoak.markerAuditPassed -ne $true -or
            $rcReport.mobileSoak.cleanupPassed -ne $true
          ) {
            throw 'Local RC report lacks a passing exact-SHA 8-session/20-recovery mobile soak.'
          }
          } else {
            $protectedEvidenceBase64 = $null
            Write-Host 'functional-hotfix profile: performance and 30-minute soak evidence are intentionally not claimed.'
          }
          $frozenHead = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $frozenHead -ne $head) {
            throw "Release checkout HEAD moved from $head to $frozenHead."
          }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect the release checkout for local changes.'
          }
          if ($dirty.Count -ne 0) { throw "Release checkout is not clean: $($dirty -join ', ')" }
          "EZTERMINAL_VERSION=$rootVersion" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_VERSION_CODE=$androidCode" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_REPOSITORY_CERT_SHA256=$repositoryCert" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_VALIDATION_PROFILE=$validationProfile" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ($validationProfile -eq 'full') {
            "LOCAL_RC_REPORT_PATH=$rcReportPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "LOCAL_RC_MOBILE_SOAK_PATH=$mobileSoakReportPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "LOCAL_RC_PERFORMANCE_BASELINE_PATH=$performanceBaselineReportPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "LOCAL_RC_PERFORMANCE_CANDIDATE_PATH=$performanceCandidateReportPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "VERIFIED_LOCAL_RC_REPORT_SHA256=$actualRcReportHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "VERIFIED_LOCAL_RC_EVIDENCE_SHA256=$actualEvidenceBundleHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          $sha8 = $head.Substring(0, 8)
          "RELEASE_ARTIFACT_NAME=EZTerminal-$rootVersion-$sha8" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_ASSETS_PATH=release-assets/$rootVersion-release-$sha8" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Desktop typecheck
        run: pnpm typecheck
      - name: Desktop lint
        run: pnpm lint
      - name: Desktop unit tests (three consecutive zero-retry runs)
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "Desktop unit gate run $_/3"
            pnpm test
            if ($LASTEXITCODE -ne 0) { throw "Desktop unit gate failed on run $_." }
          }
      - name: Dependency vulnerability gate
        run: |
          pnpm audit --prod --audit-level=low
          pnpm audit --audit-level=low

      - name: Mobile lint
        working-directory: mobile
        run: pnpm lint
      - name: Mobile typecheck
        working-directory: mobile
        run: pnpm typecheck
      - name: Mobile unit tests (three consecutive zero-retry runs)
        working-directory: mobile
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "Mobile unit gate run $_/3"
            pnpm test
            if ($LASTEXITCODE -ne 0) { throw "Mobile unit gate failed on run $_." }
          }
      - name: Mobile production build and marker gate
        working-directory: mobile
        run: pnpm build:release
      - name: Sync Capacitor Android project
        working-directory: mobile
        run: pnpm cap:sync
      - name: Verify Capacitor Android files are current
        shell: pwsh
        run: |
          $status = @(git status --porcelain --untracked-files=all -- mobile/android)
          if ($status.Count -ne 0) {
            $status | ForEach-Object { Write-Host $_ }
            throw 'Capacitor sync changed Android source. Commit generated updates.'
          }
      - name: Android release lint and unit tests
        working-directory: mobile/android
        run: .\gradlew.bat lintRelease testReleaseUnitTest --no-daemon --stacktrace

      - name: Install Chromium for Storybook checks
        run: pnpm exec playwright install chromium
      - name: Storybook interaction and accessibility tests
        run: pnpm test:storybook -- --retry=2
      - name: Storybook production build
        run: pnpm storybook:build
      - name: Storybook visual regression and axe checks
        run: pnpm test:visual
      - name: Build native remote host for desktop E2E
        run: pnpm build:remote-host
      - name: Desktop end-to-end tests
        run: pnpm e2e

      - name: Build Windows package and exact SignPath payload
        run: pnpm signpath:prepare
      - name: Verify packaged native modules
        run: pnpm guard:native
      - name: Verify packaged packet capture native module
        run: pnpm guard:native-cap
      - name: Verify PTY routing invariants
        run: pnpm guard:pty-routing
      - name: Verify approval privacy invariants
        run: pnpm guard:approval-privacy
      - name: Verify offline pairing invariants
        run: pnpm guard:pairing-offline
      - name: Verify desktop handoff source and visual mapping
        run: pnpm guard:desktop-handoff
      - name: Packaged app smoke tests
        run: pnpm test:e2e:packaged

      - name: Reverify frozen release source before signing
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EZTERMINAL_BUILD_SHA) {
            throw "Release source moved before signing: expected $env:EZTERMINAL_BUILD_SHA, got $head."
          }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect the release source immediately before signing.'
          }
          if ($dirty.Count -ne 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw 'Release source changed during validation; signing credentials were not materialized.'
          }

      - name: Upload exact unsigned Windows payload
        id: upload_unsigned_windows_payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-windows-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/signpath/payload-input/*
          if-no-files-found: error
          retention-days: 1

      - name: Request SignPath approval for Windows payload
        id: sign_windows_payload
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_WINDOWS_PAYLOAD_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_windows_payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: out/signpath/payload-signed
          parameters: |
            version: ${{ toJSON(env.EZTERMINAL_VERSION) }}

      - name: Assemble installer from verified signed payload
        run: pnpm signpath:assemble

      - name: Upload exact unsigned Windows installer
        id: upload_unsigned_windows_installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-windows-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/signpath/installer-input/EZTerminal-Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Request SignPath approval for Windows installer
        id: sign_windows_installer
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_WINDOWS_INSTALLER_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_windows_installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: out/signpath/installer-signed
          parameters: |
            version: ${{ toJSON(env.EZTERMINAL_VERSION) }}

      - name: Finalize and verify signed Windows release
        shell: pwsh
        env:
          PAYLOAD_SIGNING_REQUEST_ID: ${{ steps.sign_windows_payload.outputs.signing-request-id }}
          INSTALLER_SIGNING_REQUEST_ID: ${{ steps.sign_windows_installer.outputs.signing-request-id }}
        run: |
          pnpm signpath:finalize -- `
            --payload-request-id $env:PAYLOAD_SIGNING_REQUEST_ID `
            --installer-request-id $env:INSTALLER_SIGNING_REQUEST_ID

      - name: Verify signatures after a silent install
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'ezterminal-signature-smoke'
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          $resolvedInstallRoot = [IO.Path]::GetFullPath($installRoot)
          if (-not $resolvedInstallRoot.StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Unsafe signature smoke path: $resolvedInstallRoot"
          }
          if (Test-Path -LiteralPath $resolvedInstallRoot) {
            Remove-Item -LiteralPath $resolvedInstallRoot -Recurse -Force
          }
          try {
            $setup = (Resolve-Path -LiteralPath 'out/make/nsis/x64/EZTerminal-Setup.exe').Path
            $install = Start-Process -FilePath $setup `
              -ArgumentList @('/S', "/D=$resolvedInstallRoot") `
              -WindowStyle Hidden -PassThru
            if (-not $install.WaitForExit(120000)) {
              Stop-Process -Id $install.Id -Force
              throw 'Silent installer timed out.'
            }
            if ($install.ExitCode -ne 0) {
              throw "Silent installer exited with $($install.ExitCode)."
            }
            $installedFiles = @(
              (Join-Path $resolvedInstallRoot 'EZTerminal.exe'),
              (Join-Path $resolvedInstallRoot 'resources/ezterminal-remote-host.exe'),
              (Join-Path $resolvedInstallRoot 'Uninstall EZTerminal.exe')
            )
            ./scripts/verify-windows-signatures.ps1 `
              -Path $installedFiles `
              -ExpectedStatus Valid `
              -ExpectedPublisher 'SignPath Foundation' `
              -RequireTimestamp `
              -ExpectedProductName EZTerminal `
              -ExpectedProductVersion $env:EZTERMINAL_VERSION | Out-Null
          } finally {
            $uninstaller = Join-Path $resolvedInstallRoot 'Uninstall EZTerminal.exe'
            if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
              $uninstall = Start-Process -FilePath $uninstaller `
                -ArgumentList '/S' -WindowStyle Hidden -PassThru
              if (-not $uninstall.WaitForExit(120000)) {
                Stop-Process -Id $uninstall.Id -Force
              }
            }
            if (Test-Path -LiteralPath $resolvedInstallRoot) {
              Remove-Item -LiteralPath $resolvedInstallRoot -Recurse -Force
            }
          }

      - name: Materialize protected Android release keystore
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          $required = @($env:KEYSTORE_B64, $env:CERT_SHA256)
          if ($required.Where({ [string]::IsNullOrWhiteSpace($_) }).Count -ne 0) {
            throw 'Android keystore base64 and certificate SHA-256 are required.'
          }
          $cert = ($env:CERT_SHA256 -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($cert -notmatch '^[0-9A-F]{64}$') {
            throw 'ANDROID_SIGNING_CERT_SHA256 must contain exactly 64 hexadecimal digits.'
          }
          if ($cert -ne $env:ANDROID_REPOSITORY_CERT_SHA256) {
            throw 'Protected Android certificate fingerprint differs from the fingerprint committed in signing-certificate.sha256.'
          }
          $path = Join-Path $env:RUNNER_TEMP 'ezterminal-android-release.keystore'
          if (Test-Path -LiteralPath $path) {
            throw 'The protected Android keystore target already exists.'
          }
          try {
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_B64))
          } catch {
            throw 'ANDROID_KEYSTORE_BASE64 is not valid base64.'
          }
          "ANDROID_KEYSTORE_PATH=$path" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SIGNING_CERT_SHA256=$cert" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'Protected Android release keystore materialized in RUNNER_TEMP.'

      - name: Assemble signed Android release APK
        working-directory: mobile/android
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $required = @(
            $env:ANDROID_KEYSTORE_PASSWORD,
            $env:ANDROID_KEY_ALIAS,
            $env:ANDROID_KEY_PASSWORD
          )
          if ($required.Where({ [string]::IsNullOrWhiteSpace($_) }).Count -ne 0) {
            throw 'All Android key password and alias secrets are required.'
          }
          .\gradlew.bat assembleRelease --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) {
            throw 'Signed Android release assembly failed.'
          }

      - name: Remove protected Android keystore after assembly
        if: always()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'ezterminal-android-release.keystore'
          if (Test-Path -LiteralPath $path) {
            Remove-Item -LiteralPath $path -Force
          }

      - name: Verify and stage exact-SHA release artifacts
        shell: pwsh
        run: |
          $stage = @{
            AndroidApkPath = 'mobile/android/app/build/outputs/apk/release/app-release.apk'
            AndroidMetadataPath = 'mobile/android/app/build/outputs/apk/release/output-metadata.json'
            AndroidCertSha256 = $env:ANDROID_REPOSITORY_CERT_SHA256
            ExpectedCommit = $env:EZTERMINAL_BUILD_SHA
            ExpectedWindowsSignature = 'Valid'
            ExpectedWindowsPublisher = 'SignPath Foundation'
            WindowsUninstallerPath = 'out/signpath/retained/Uninstall EZTerminal.exe'
            WindowsPayloadSigningRequestId = '${{ steps.sign_windows_payload.outputs.signing-request-id }}'
            WindowsInstallerSigningRequestId = '${{ steps.sign_windows_installer.outputs.signing-request-id }}'
            ArtifactStage = 'release'
            ReleaseAssetsPath = $env:RELEASE_ASSETS_PATH
            RequireCleanTree = $true
          }
          if ($env:RELEASE_VALIDATION_PROFILE -eq 'full') {
            $stage.LocalRcReportSha256 = $env:VERIFIED_LOCAL_RC_REPORT_SHA256
            $stage.LocalRcReportPath = $env:LOCAL_RC_REPORT_PATH
            $stage.MobileSoakReportPath = $env:LOCAL_RC_MOBILE_SOAK_PATH
            $stage.PerformanceBaselineReportPath = $env:LOCAL_RC_PERFORMANCE_BASELINE_PATH
            $stage.PerformanceCandidateReportPath = $env:LOCAL_RC_PERFORMANCE_CANDIDATE_PATH
            $stage.EvidenceBundleSha256 = $env:VERIFIED_LOCAL_RC_EVIDENCE_SHA256
          }
          ./scripts/stage-release-artifacts.ps1 @stage

      - name: Remove protected local RC transport files after staging
        if: always()
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "local-rc-evidence-$env:EZTERMINAL_BUILD_SHA"
          $bundle = Join-Path $env:RUNNER_TEMP 'local-rc-evidence.zip'
          if (Test-Path -LiteralPath $directory) {
            Remove-Item -LiteralPath $directory -Recurse -Force
          }
          if (Test-Path -LiteralPath $bundle) {
            Remove-Item -LiteralPath $bundle -Force
          }

      - name: Export immutable publish metadata
        id: publish_metadata
        shell: pwsh
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:RELEASE_ARTIFACT_NAME) -or
            [string]::IsNullOrWhiteSpace($env:EZTERMINAL_VERSION) -or
            [string]::IsNullOrWhiteSpace($env:RELEASE_VALIDATION_PROFILE)
          ) {
            throw 'Release publish metadata is incomplete.'
          }
          $manifestPath = Join-Path $env:RELEASE_ASSETS_PATH 'release-manifest.json'
          $sumsPath = Join-Path $env:RELEASE_ASSETS_PATH 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Release staging did not produce $manifestPath."
          }
          if (-not (Test-Path -LiteralPath $sumsPath -PathType Leaf)) {
            throw "Release staging did not produce $sumsPath."
          }
          $releaseSumsSha256 = (
            Get-FileHash -LiteralPath $sumsPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          "artifact_name=$env:RELEASE_ARTIFACT_NAME" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_version=$env:EZTERMINAL_VERSION" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "validation_profile=$env:RELEASE_VALIDATION_PROFILE" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_notes_path=docs/release/release-notes-$env:EZTERMINAL_VERSION.md" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_sums_sha256=$releaseSumsSha256" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload unified release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: ${{ env.RELEASE_ASSETS_PATH }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          $keystore = Join-Path $env:RUNNER_TEMP 'ezterminal-android-release.keystore'
          if (Test-Path -LiteralPath $keystore) {
            Remove-Item -LiteralPath $keystore -Force
          }
          $directory = Join-Path $env:RUNNER_TEMP "local-rc-evidence-$env:EZTERMINAL_BUILD_SHA"
          $bundle = Join-Path $env:RUNNER_TEMP 'local-rc-evidence.zip'
          if (Test-Path -LiteralPath $directory) {
            Remove-Item -LiteralPath $directory -Recurse -Force
          }
          if (Test-Path -LiteralPath $bundle) {
            Remove-Item -LiteralPath $bundle -Force
          }

  publish:
    name: Publish verified draft release
    needs: release
    if: github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout release notes without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: release-source

      - name: Download immutable release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release.outputs.artifact_name }}
          path: publish-assets

      - name: Reverify downloaded manifest and checksums
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.release.outputs.release_version }}
          EXPECTED_PROFILE: ${{ needs.release.outputs.validation_profile }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.release.outputs.artifact_name }}
          EXPECTED_NOTES_PATH: ${{ needs.release.outputs.release_notes_path }}
          EXPECTED_SUMS_SHA256: ${{ needs.release.outputs.release_sums_sha256 }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $expectedVersion = $env:EXPECTED_VERSION
          $expectedProfile = $env:EXPECTED_PROFILE
          $expectedArtifactName = $env:EXPECTED_ARTIFACT_NAME
          $expectedNotesPath = $env:EXPECTED_NOTES_PATH
          $expectedSumsSha256 = $env:EXPECTED_SUMS_SHA256
          $expectedSha8 = $env:WORKFLOW_SHA.Substring(0, 8)
          if (
            $expectedVersion -notmatch '^\d+\.\d+\.\d+$' -or
            $expectedProfile -notin @('full', 'functional-hotfix') -or
            $expectedArtifactName -cne
              "EZTerminal-$expectedVersion-$expectedSha8" -or
            $expectedNotesPath -cne
              "docs/release/release-notes-$expectedVersion.md" -or
            $expectedSumsSha256 -notmatch '^[0-9a-f]{64}$' -or
            $env:WORKFLOW_REF_NAME -cne "v$expectedVersion"
          ) {
            throw 'Publish metadata or release tag does not match the verified build job.'
          }

          $sourceHead = (git -C release-source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceHead -cne $env:WORKFLOW_SHA) {
            throw "Publish source checkout differs from $env:WORKFLOW_SHA."
          }
          $notesPath = Join-Path 'release-source' $expectedNotesPath
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Release notes are missing from the exact source SHA: $notesPath"
          }
          if (
            (Get-Item -LiteralPath $notesPath -Force).Attributes -band
              [IO.FileAttributes]::ReparsePoint
          ) {
            throw "Release notes must not be a linked file: $notesPath"
          }

          $assets = (Resolve-Path -LiteralPath 'publish-assets').Path
          if (
            (Get-Item -LiteralPath $assets -Force).Attributes -band
              [IO.FileAttributes]::ReparsePoint
          ) {
            throw 'Downloaded release artifact root must not be a reparse point.'
          }
          $entries = @(Get-ChildItem -LiteralPath $assets -Force)
          if (
            $entries.Count -lt 1 -or
            @($entries | Where-Object {
              $_.PSIsContainer -or
              ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
              $_.Name -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$'
            }).Count -ne 0
          ) {
            throw 'Downloaded release artifact contains an unsafe or nested entry.'
          }
          $manifestPath = Join-Path $assets 'release-manifest.json'
          $sumsPath = Join-Path $assets 'SHA256SUMS.txt'
          if (
            -not (Test-Path -LiteralPath $manifestPath -PathType Leaf) -or
            -not (Test-Path -LiteralPath $sumsPath -PathType Leaf)
          ) {
            throw 'Downloaded release artifact lacks its manifest or SHA256SUMS.'
          }
          $actualSumsSha256 = (
            Get-FileHash -LiteralPath $sumsPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          if ($actualSumsSha256 -cne $expectedSumsSha256) {
            throw 'Downloaded SHA256SUMS differs from the immutable build-job digest.'
          }
          try {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw |
              ConvertFrom-Json
          } catch {
            throw 'Downloaded release-manifest.json is not valid JSON.'
          }
          if (
            [string]$manifest.appVersion -cne $expectedVersion -or
            [string]$manifest.validationProfile -cne $expectedProfile -or
            [string]$manifest.artifactStage -cne 'release' -or
            $manifest.publicationEligible -ne $true -or
            [string]$manifest.evidenceCompleteness -cne 'complete' -or
            [string]$manifest.buildSha -cne $env:WORKFLOW_SHA -or
            $manifest.embeddedBuildShaVerified -ne $true -or
            [int]$manifest.protocolVersion -lt 1 -or
            [int]$manifest.androidVersionCode -lt 1 -or
            [string]$manifest.windowsAuthenticode.expected -cne 'Valid' -or
            [string]$manifest.windowsAuthenticode.publisher -cne 'SignPath Foundation' -or
            $manifest.windowsAuthenticode.timestampRequired -ne $true -or
            [string]$manifest.windowsAuthenticode.app -cne 'Valid' -or
            [string]$manifest.windowsAuthenticode.remoteHost -cne 'Valid' -or
            [string]$manifest.windowsAuthenticode.uninstaller -cne 'Valid' -or
            [string]$manifest.windowsAuthenticode.setup -cne 'Valid' -or
            [string]$manifest.windowsAuthenticode.signingRequestIds.payload -notmatch '^[A-Za-z0-9-]{8,128}$' -or
            [string]$manifest.windowsAuthenticode.signingRequestIds.installer -notmatch '^[A-Za-z0-9-]{8,128}$' -or
            [string]$manifest.windowsAuthenticode.components.app.sha256 -notmatch '^[0-9a-f]{64}$' -or
            [string]$manifest.windowsAuthenticode.components.remoteHost.sha256 -notmatch '^[0-9a-f]{64}$' -or
            [string]$manifest.windowsAuthenticode.components.uninstaller.sha256 -notmatch '^[0-9a-f]{64}$' -or
            [string]$manifest.windowsAuthenticode.components.setup.sha256 -notmatch '^[0-9a-f]{64}$' -or
            [string]$manifest.windowsAuthenticode.components.setup.publisher -cne 'SignPath Foundation' -or
            [string]$manifest.windowsAuthenticode.components.setup.signerCertificateSha256 -notmatch '^[0-9a-f]{64}$' -or
            $manifest.windowsAuthenticode.components.setup.timestamped -ne $true -or
            [string]$manifest.windowsAuthenticode.components.setup.timestampCertificateSha256 -notmatch '^[0-9a-f]{64}$' -or
            [string]$manifest.androidSigningCertSha256 -notmatch '^[0-9A-F]{64}$'
          ) {
            throw 'Downloaded release manifest is not publication-eligible exact-SHA evidence.'
          }
          foreach ($componentName in @('app', 'remoteHost', 'uninstaller', 'setup')) {
            $component = $manifest.windowsAuthenticode.components.$componentName
            if (
              [string]$component.status -cne 'Valid' -or
              [string]$component.sha256 -notmatch '^[0-9a-f]{64}$' -or
              [string]$component.publisher -cne 'SignPath Foundation' -or
              [string]$component.signerCertificateSha256 -notmatch '^[0-9a-f]{64}$' -or
              $component.timestamped -ne $true -or
              [string]$component.timestampCertificateSha256 -notmatch '^[0-9a-f]{64}$'
            ) {
              throw "Invalid Windows Authenticode component evidence: $componentName"
            }
          }
          $androidArtifact = (
            "EZTerminal-Android-$expectedVersion-vc" +
            "$([int]$manifest.androidVersionCode).apk"
          )
          $rawEvidenceArtifacts = @(
            'local-rc-report.json',
            'mobile-soak-report.json',
            'desktop-performance-baseline.json',
            'desktop-performance-report.json'
          )
          $requiredArtifactNames = @(
            'EZTerminal-Setup.exe',
            'sbom.cdx.json',
            $androidArtifact,
            "$androidArtifact.sha256"
          )
          if ($expectedProfile -eq 'full') {
            $requiredArtifactNames += $rawEvidenceArtifacts
          }
          $declaredArtifactNames = @(
            $manifest.artifacts | ForEach-Object { [string]$_ }
          )
          $missingRequiredArtifacts = @(
            $requiredArtifactNames | Where-Object {
              $declaredArtifactNames -cnotcontains $_
            }
          )
          if ($missingRequiredArtifacts.Count -ne 0) {
            throw (
              'Downloaded release manifest omits required artifacts: ' +
              ($missingRequiredArtifacts -join ', ')
            )
          }
          if ($expectedProfile -eq 'full') {
            if (
              $manifest.localRcReportVerified -ne $true -or
              $manifest.sourceEvidence.verified -ne $true -or
              [string]$manifest.localRcReportSha256 -notmatch '^[0-9a-f]{64}$' -or
              [string]$manifest.sourceEvidence.approvalBundleSha256 -notmatch
                '^[0-9a-f]{64}$' -or
              [string]$manifest.sourceEvidence.mobileSoakReportSha256 -notmatch
                '^[0-9a-f]{64}$' -or
              [string]$manifest.sourceEvidence.performanceBaselineReportSha256 -notmatch
                '^[0-9a-f]{64}$' -or
              [string]$manifest.sourceEvidence.performanceCandidateReportSha256 -notmatch
                '^[0-9a-f]{64}$' -or
              [string]$manifest.validation.performanceBenchmark -cne 'passed' -or
              [string]$manifest.validation.mobileSoak -cne 'passed'
            ) {
              throw 'Downloaded release manifest lacks verified raw source evidence.'
            }
          } elseif (
            $manifest.localRcReportVerified -ne $false -or
            $null -ne $manifest.sourceEvidence -or
            @($rawEvidenceArtifacts | Where-Object {
              $declaredArtifactNames -ccontains $_
            }).Count -ne 0
          ) {
            throw 'Functional-hotfix manifest must not claim full source evidence.'
          }

          $sumLines = @(Get-Content -LiteralPath $sumsPath -Encoding ascii)
          $hashedFiles = @($entries | Where-Object { $_.Name -cne 'SHA256SUMS.txt' })
          if ($sumLines.Count -ne $hashedFiles.Count) {
            throw 'SHA256SUMS does not cover the exact downloaded file set.'
          }
          $seen = [Collections.Generic.HashSet[string]]::new(
            [StringComparer]::Ordinal
          )
          foreach ($line in $sumLines) {
            if ($line -cnotmatch '^([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)$') {
              throw "Malformed SHA256SUMS line: $line"
            }
            $expectedHash = $Matches[1]
            $name = $Matches[2]
            if (-not $seen.Add($name)) {
              throw "Duplicate SHA256SUMS entry: $name"
            }
            $matches = @($hashedFiles | Where-Object { $_.Name -ceq $name })
            if ($matches.Count -ne 1) {
              throw "SHA256SUMS names an absent or ambiguous file: $name"
            }
            $actualHash = (
              Get-FileHash -LiteralPath $matches[0].FullName -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            if ($actualHash -cne $expectedHash) {
              throw "Downloaded artifact hash mismatch for $name."
            }
          }

          $setupPath = Join-Path $assets 'EZTerminal-Setup.exe'
          $signatureJson = @(
            & ./release-source/scripts/verify-windows-signatures.ps1 `
              -Path $setupPath `
              -ExpectedStatus Valid `
              -ExpectedPublisher 'SignPath Foundation' `
              -RequireTimestamp `
              -ExpectedProductName EZTerminal `
              -ExpectedProductVersion $expectedVersion
          ) -join [Environment]::NewLine
          $setupSignature = @(($signatureJson | ConvertFrom-Json).files)[0]
          if (
            [string]$setupSignature.sha256 -cne
              [string]$manifest.windowsAuthenticode.components.setup.sha256 -or
            [string]$setupSignature.signerCertificateSha256 -cne
              [string]$manifest.windowsAuthenticode.components.setup.signerCertificateSha256 -or
            [string]$setupSignature.timestampCertificateSha256 -cne
              [string]$manifest.windowsAuthenticode.components.setup.timestampCertificateSha256
          ) {
            throw 'Published Setup Authenticode evidence differs from the build manifest.'
          }

          $actualArtifactNames = @(
            $entries |
              Where-Object {
                $_.Name -cnotin @('release-manifest.json', 'SHA256SUMS.txt')
              } |
              ForEach-Object { [string]$_.Name } |
              Sort-Object
          )
          $manifestArtifactNames = @(
            $declaredArtifactNames | Sort-Object
          )
          $artifactDifferences = @(
            Compare-Object `
              -ReferenceObject $actualArtifactNames `
              -DifferenceObject $manifestArtifactNames
          )
          if (
            $actualArtifactNames.Count -ne $manifestArtifactNames.Count -or
            $artifactDifferences.Count -ne 0
          ) {
            throw 'Downloaded file set differs from release-manifest artifacts.'
          }

      - name: Create draft GitHub Release from reverified files
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          body_path: release-source/${{ needs.release.outputs.release_notes_path }}
          fail_on_unmatched_files: true
          files: publish-assets/*
