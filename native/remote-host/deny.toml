[graph]
all-features = true
targets = ["x86_64-pc-windows-msvc"]

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # Timing variability in crypto-bigint 0.5, reached only through the pinned webrtc 0.17 -> dtls 0.17 -> p256/p384 ->
  # elliptic-curve 0.13 (the DTLS handshake of the remote-desktop path, after a device has paired over the bridge).
  # The fix needs webrtc >= 0.21, a sans-IO rewrite of that stack: tracked as the native host migration. Review by 2026-12-01.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via pinned webrtc 0.17 DTLS; fix needs the webrtc 0.21 migration (review by 2026-12-01)" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
